<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Employee</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container update-container">

        <h1>Update Employee</h1>


        <form id="updateEmployeeForm">


            <label for="name">
                Employee Name
            </label>

            <input
                type="text"
                id="name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label for="salary">
                Salary
            </label>

            <input
                type="number"
                id="salary"
                required
            >


            <button type="submit">
                Update Employee
            </button>


            <button
                type="button"
                class="cancel-btn"
                onclick="goBack()"
            >
                Cancel
            </button>

        </form>

    </div>


    <script src="js/employee-update.js"></script>

</body>

</html>
