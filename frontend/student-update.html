<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Student</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container update-container">

        <h1>Update Student</h1>


        <form id="updateStudentForm">


            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <label for="course">
                Course
            </label>

            <input
                type="text"
                id="course"
                required
            >


            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                required
            >


            <button type="submit">
                Update Student
            </button>


            <button
                type="button"
                class="cancel-btn"
                onclick="goBack()"
            >
                Cancel
            </button>

        </form>

    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/student-update.js"></script>

</body>

</html>
